x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: household-finances-app
  volumes:
    - .:/var/www/html
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app

  web:
    image: nginx:stable-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  queue:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_DATABASE:-household_finances}
      POSTGRES_USER: ${DB_USERNAME:-household}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: America/Sao_Paulo
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init-testing-db.sql:/docker-entrypoint-initdb.d/init-testing-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
